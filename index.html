<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080812">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3-1-2 DMO">
<title>3-1-2 DMO — 登入</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@600;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080812;--bg1:#0e0e20;--bg2:#14142a;--bg3:#1c1c38;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#eeeeff;--muted:#4a4a7a;--muted2:#8080b0;
  --gold:#f5c842;--gold2:#ffe566;--gold-dim:rgba(245,200,66,0.1);
  --green:#22d37a;--red:#ff4466;--blue:#60a5fa;
  --purple:#b06eff;--purple2:#d4aaff;--purple-dim:rgba(176,110,255,0.1);
  --r:16px;--r-sm:10px;
  --mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;--orb:'Orbitron',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse at 20% 20%,rgba(96,165,250,0.06) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(176,110,255,0.06) 0%,transparent 50%),
             radial-gradient(ellipse at 50% 100%,rgba(245,200,66,0.04) 0%,transparent 50%);
  pointer-events:none}

/* STARS */
#stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:var(--o,.3);transform:scale(1)}50%{opacity:1;transform:scale(1.8)}}

/* LOADING */
#loading{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#loading.fade{opacity:0;pointer-events:none}
.load-logo{font-family:var(--orb);font-size:2rem;color:var(--gold);text-shadow:0 0 30px rgba(245,200,66,.6);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
.load-bar{width:180px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.load-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--gold));border-radius:2px;animation:lbar 2s ease forwards}
@keyframes lbar{from{width:0}to{width:100%}}

/* TOAST */
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);padding:11px 24px;border-radius:24px;font-weight:700;font-size:.82rem;z-index:9999;transition:transform .35s cubic-bezier(.175,.885,.32,1.275);white-space:nowrap;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.green{background:linear-gradient(135deg,#00c96a,#00ff88);color:#080812;box-shadow:0 6px 24px rgba(0,201,106,.4)}
#toast.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#080812;box-shadow:0 6px 24px rgba(245,200,66,.4)}
#toast.red{background:linear-gradient(135deg,var(--red),#ff6688);color:#fff;box-shadow:0 6px 24px rgba(255,68,102,.4)}
#toast.purple{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 6px 24px rgba(176,110,255,.4)}

/* MAIN */
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100dvh;padding:0 24px;display:flex;flex-direction:column;justify-content:center}

/* HERO */
.hero{text-align:center;margin-bottom:40px}
.hero-logo{font-family:var(--orb);font-size:2.2rem;color:var(--gold);letter-spacing:4px;text-shadow:0 0 30px rgba(245,200,66,.5);margin-bottom:8px;animation:floatY 3s ease-in-out infinite}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hero-sub{font-size:.8rem;color:var(--muted2);letter-spacing:2px}
.hero-chars{display:flex;justify-content:center;gap:16px;margin-top:20px}
.hero-char{font-size:2rem;animation:floatY 3s ease-in-out infinite}
.hero-char:nth-child(2){animation-delay:.4s}
.hero-char:nth-child(3){animation-delay:.8s}
.hero-char:nth-child(4){animation-delay:1.2s}

/* TABS */
.tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--bg2);padding:4px;border-radius:14px;border:1px solid var(--border)}
.tab{flex:1;padding:11px;border-radius:10px;border:none;background:transparent;color:var(--muted2);font-family:var(--sans);font-size:.85rem;font-weight:700;cursor:pointer;text-align:center;transition:all .25s}
.tab.active{background:linear-gradient(135deg,var(--purple-dim),rgba(176,110,255,.06));border:1px solid rgba(176,110,255,.3);color:var(--purple2)}

/* FORM */
.form{display:none}.form.active{display:block}
.inp-label{font-size:.68rem;color:var(--muted2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.inp{width:100%;padding:13px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:.9rem;font-family:var(--sans);outline:none;transition:all .2s;margin-bottom:14px;-webkit-appearance:none}
.inp:focus{border-color:var(--purple);background:rgba(176,110,255,.04);box-shadow:0 0 0 3px rgba(176,110,255,.1)}
.inp::placeholder{color:var(--muted)}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp-row .inp-group{display:flex;flex-direction:column}

/* REMEMBER */
.rem-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;cursor:pointer;padding:8px 0}
.rem-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border2);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s}
.rem-box.on{background:var(--purple);border-color:var(--purple);box-shadow:0 0 10px rgba(176,110,255,.4)}
.rem-box.on::after{content:'✓';font-size:.75rem;color:#fff;font-weight:700}
.rem-label{font-size:.8rem;color:var(--muted2)}

/* BUTTON */
.btn-gold{width:100%;padding:15px;border:none;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#080812;font-size:.95rem;font-weight:900;font-family:var(--sans);cursor:pointer;transition:all .2s;box-shadow:0 4px 24px rgba(245,200,66,.3);letter-spacing:.5px}
.btn-gold:active{opacity:.85;transform:scale(.98)}
.btn-gold:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* DIVIDER */
.hint{text-align:center;margin-top:16px;font-size:.75rem;color:var(--muted2)}

/* CARD */
.auth-card{background:linear-gradient(135deg,rgba(20,20,42,.9),rgba(14,14,32,.95));border:1px solid var(--border2);border-radius:20px;padding:24px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* FOOTER */
.footer{text-align:center;padding:24px 0;font-size:.68rem;color:var(--muted);position:relative;z-index:1}

/* SPIN */
.spin{display:inline-block;animation:spinning .8s linear infinite}
@keyframes spinning{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="stars"></div>
<div id="toast"></div>

<div id="loading">
  <div class="load-logo">3·1·2</div>
  <div style="font-size:.7rem;color:var(--muted2);letter-spacing:3px;margin-top:-8px">DMO 英雄養成</div>
  <div class="load-bar"><div class="load-fill"></div></div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="hero-logo">3 · 1 · 2</div>
    <div class="hero-sub">DMO · 英雄養成系統</div>
    <div class="hero-chars">
      <span class="hero-char">🌿</span>
      <span class="hero-char">⚡</span>
      <span class="hero-char">🔮</span>
      <span class="hero-char">🎯</span>
    </div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">登入</button>
      <button class="tab" onclick="switchTab('register')">新註冊</button>
    </div>

    <!-- LOGIN -->
    <div class="form active" id="login-form">
      <div class="inp-label">帳號</div>
      <input class="inp" id="l-user" placeholder="輸入你的帳號" maxlength="20" autocomplete="username" autocapitalize="none">
      <div class="inp-label">密碼</div>
      <input class="inp" id="l-pass" type="password" placeholder="輸入密碼" maxlength="20" autocomplete="current-password">
      <div class="rem-row" onclick="toggleRem()">
        <div class="rem-box" id="rem-box"></div>
        <div class="rem-label">記住我（30天免重新登入）</div>
      </div>
      <button class="btn-gold" id="login-btn" onclick="doLogin()">登入 →</button>
      <div class="hint">還沒有帳號？點上方「新註冊」</div>
    </div>

    <!-- REGISTER -->
    <div class="form" id="register-form">
      <div class="inp-label">帳號（英文 + 數字，登入用）</div>
      <input class="inp" id="r-user" placeholder="例：karen2024" maxlength="20" autocomplete="username" autocapitalize="none">
      <div class="inp-label">密碼（至少 4 碼）</div>
      <input class="inp" id="r-pass" type="password" placeholder="設定你的密碼" maxlength="20" autocomplete="new-password">
      <div class="inp-label">你的姓名</div>
      <input class="inp" id="r-name" placeholder="例：Karen、小美" maxlength="20">
      <div class="inp-row">
        <div class="inp-group">
          <div class="inp-label">所在地區</div>
          <input class="inp" id="r-region" placeholder="例：台南" maxlength="20">
        </div>
        <div class="inp-group">
          <div class="inp-label">所屬大C（上線名稱）</div>
          <input class="inp" id="r-leader" placeholder="例：珉適" maxlength="20">
        </div>
      </div>
      <button class="btn-gold" id="reg-btn" onclick="doRegister()">註冊並開始人格測驗 →</button>
      <div class="hint">已有帳號？點上方「登入」</div>
    </div>
  </div>

  <div class="footer">成功不是靠爆發，而是靠每天重複簡單動作<br>流量 · 曝光 · 跟進</div>
</div>

<!-- Firebase -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,collection,getDocs}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
const FC={apiKey:"AIzaSyAjL5gKNWrWIRAOReK8pcD79Q3upiYX_ag",authDomain:"shop-com-c2f2c.firebaseapp.com",projectId:"shop-com-c2f2c",storageBucket:"shop-com-c2f2c.firebasestorage.app",messagingSenderId:"295739796312",appId:"1:295739796312:web:00d0f3566cbc10841b532d"};
const app=initializeApp(FC);
const db=getFirestore(app);
window.db=db;
window.FB={doc,getDoc,setDoc,collection,getDocs};
window.dispatchEvent(new Event('fbReady'));
</script>

<script>
// STARS
function initStars(){
  const c=document.getElementById('stars');
  for(let i=0;i<50;i++){
    const s=document.createElement('div');s.className='star';
    const sz=Math.random()*2+.5;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${.1+Math.random()*.4};animation-delay:${Math.random()*4}s`;
    c.appendChild(s);
  }
}
initStars();

// DEFAULT ADMINS
const ADMINS=[{u:'admin',p:'312admin'},{u:'bosen',p:'312boss'},{u:'leader',p:'312lead'}];
let remOn=false;
let fbOk=false;

window.addEventListener('fbReady',async()=>{
  fbOk=true;
  await initAdmins();
  checkAutoLogin();
  setTimeout(()=>{
    const l=document.getElementById('loading');
    l.classList.add('fade');
    setTimeout(()=>l.style.display='none',500);
  },1600);
});

async function initAdmins(){
  const{doc,getDoc,setDoc}=window.FB;
  for(const a of ADMINS){
    const r=doc(window.db,'admins',a.u);
    const s=await getDoc(r);
    if(!s.exists()) await setDoc(r,{username:a.u,password:a.p,createdAt:new Date().toISOString()});
  }
}

function checkAutoLogin(){
  try{
    const raw=localStorage.getItem('dmo_auth');
    if(!raw)return;
    const s=JSON.parse(raw);
    if(s.expiry<Date.now()){localStorage.removeItem('dmo_auth');return;}
    goApp(s.username,s.isAdmin);
  }catch(e){}
}

// TABS
function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',i===(t==='login'?0:1)));
  document.getElementById('login-form').classList.toggle('active',t==='login');
  document.getElementById('register-form').classList.toggle('active',t==='register');
}

// REMEMBER
function toggleRem(){
  remOn=!remOn;
  const b=document.getElementById('rem-box');
  b.classList.toggle('on',remOn);
}

// LOGIN
async function doLogin(){
  if(!fbOk){toast('連線中，請稍候…','red');return;}
  const username=v('l-user').toLowerCase();
  const password=v('l-pass');
  if(!username||!password){toast('請填寫帳號和密碼','red');return;}
  setBtn('login-btn',true,'登入中…');
  try{
    const{doc,getDoc}=window.FB;
    // check admin
    const aSnap=await getDoc(doc(window.db,'admins',username));
    if(aSnap.exists()&&aSnap.data().password===password){
      if(remOn)saveSession(username,true);
      goApp(username,true);return;
    }
    // check user
    const uSnap=await getDoc(doc(window.db,'users',username));
    if(!uSnap.exists()){toast('帳號不存在，請確認或先註冊','red');return;}
    if(uSnap.data().password!==password){toast('密碼錯誤，請重試','red');return;}
    if(remOn)saveSession(username,false);
    goApp(username,false);
  }catch(e){toast('連線錯誤，請稍後再試','red');console.error(e);}
  finally{setBtn('login-btn',false,'登入 →');}
}

// REGISTER
async function doRegister(){
  if(!fbOk){toast('連線中，請稍候…','red');return;}
  const username=v('r-user').toLowerCase();
  const password=v('r-pass');
  const name=v('r-name');
  const region=v('r-region');
  const leader=v('r-leader');
  if(!username||!password||!name||!region||!leader){toast('請填寫所有欄位','red');return;}
  if(!/^[a-z0-9_]{3,20}$/.test(username)){toast('帳號只能用英文小寫、數字、底線（3-20字）','red');return;}
  if(password.length<4){toast('密碼至少 4 碼','red');return;}
  setBtn('reg-btn',true,'註冊中…');
  try{
    const{doc,getDoc,setDoc}=window.FB;
    // check duplicate
    const snap=await getDoc(doc(window.db,'users',username));
    if(snap.exists()){toast('此帳號已被使用，請換一個','red');return;}
    // check admin name conflict
    const aSnap=await getDoc(doc(window.db,'admins',username));
    if(aSnap.exists()){toast('此帳號已被使用，請換一個','red');return;}
    const userData={
      username,password,name,region,leader,
      charId:'',xp:0,level:1,
      days:{},timeline:[],
      createdAt:new Date().toISOString()
    };
    await setDoc(doc(window.db,'users',username),userData);
    // go to app for quiz
    if(remOn)saveSession(username,false);
    goApp(username,false,true);
  }catch(e){toast('連線錯誤，請稍後再試','red');console.error(e);}
  finally{setBtn('reg-btn',false,'註冊並開始人格測驗 →');}
}

function saveSession(username,isAdmin){
  const days=remOn?30:1;
  const expiry=Date.now()+days*24*3600*1000;
  localStorage.setItem('dmo_auth',JSON.stringify({username,isAdmin,expiry}));
}

function goApp(username,isAdmin,isNew=false){
  const params=new URLSearchParams({u:username,admin:isAdmin?'1':'0',new:isNew?'1':'0'});
  window.location.href='app.html?'+params.toString();
}

// UTILS
function v(id){return document.getElementById(id).value.trim();}
function setBtn(id,disabled,text){const b=document.getElementById(id);b.disabled=disabled;b.textContent=text;}
let toastT;
function toast(msg,cls='green'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=cls+' show';
  clearTimeout(toastT);toastT=setTimeout(()=>el.className='',2800);
}
// enter key
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(document.getElementById('login-form').classList.contains('active'))doLogin();
  else doRegister();
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
